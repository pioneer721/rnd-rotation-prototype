<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R&amp;D Rotation</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --fg: #16181d;
    --muted: #6b7280;
    --line: #e3e6ea;
    --accent: #2b6cf6;
    --accent-fg: #ffffff;
    --field: #fbfbfc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121317;
      --card: #1b1d22;
      --fg: #eceef2;
      --muted: #9aa1ad;
      --line: #2c2f36;
      --accent: #4b86ff;
      --field: #212429;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }

  h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -.01em;
  }

  .sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 13.5px;
  }

  label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 550;
  }

  .field { margin-bottom: 20px; }

  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--fg);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 9px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  input[type="text"]::placeholder { color: var(--muted); }

  input[type="file"] { display: none; }

  .drop {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 26px 16px;
    text-align: center;
    background: var(--field);
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop svg { color: var(--muted); }
  .drop-main { font-size: 13.5px; font-weight: 550; }
  .drop-sub { font-size: 12px; color: var(--muted); }

  .preview {
    display: none;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    padding: 10px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .preview.show { display: flex; }
  .preview img {
    height: 46px;
    max-width: 132px;
    width: auto;
    object-fit: contain;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: #fff;
    flex-shrink: 0;
  }
  .preview .meta { min-width: 0; flex: 1; }
  .preview .name {
    font-size: 13px;
    font-weight: 550;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .preview .size { font-size: 12px; color: var(--muted); }
  .remove {
    flex-shrink: 0;
    padding: 5px 10px;
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 7px;
    cursor: pointer;
  }
  .remove:hover { color: var(--fg); }

  button[type="submit"] {
    width: 100%;
    margin-top: 4px;
    padding: 11px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-fg);
    background: var(--accent);
    border: 0;
    border-radius: 9px;
    cursor: pointer;
  }
  button[type="submit"]:hover { filter: brightness(1.07); }
  button[type="submit"]:disabled {
    opacity: .45;
    cursor: not-allowed;
    filter: none;
  }

  .note {
    margin: 16px 0 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  .status {
    display: none;
    margin: 14px 0 0;
    padding: 10px 12px;
    border-radius: 9px;
    font-size: 13px;
    line-height: 1.45;
  }
  .status.show { display: block; }
  .status.busy { background: var(--field); border: 1px solid var(--line); color: var(--muted); }
  .status.ok   { background: color-mix(in srgb, #16a34a 12%, transparent); border: 1px solid color-mix(in srgb, #16a34a 40%, transparent); color: #15803d; }
  .status.err  { background: color-mix(in srgb, #dc2626 12%, transparent); border: 1px solid color-mix(in srgb, #dc2626 40%, transparent); color: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    .status.ok  { color: #86efac; }
    .status.err { color: #fca5a5; }
  }
</style>
</head>
<body>

<form class="card" id="form" autocomplete="off">
  <h1>R&amp;D Rotation</h1>
  <p class="sub">Enter your name and attach an image or PDF.</p>

  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="e.g. Howard Han" required>
  </div>

  <div class="field">
    <label for="file">Image or PDF</label>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose an image or PDF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <span class="drop-main">Click to upload</span>
      <span class="drop-sub">or drag and drop &middot; PNG, JPG, PDF</span>
    </div>
    <input type="file" id="file" name="file" accept="image/*,application/pdf,.pdf">

    <div class="preview" id="preview">
      <img id="thumb" alt="">
      <div class="meta">
        <div class="name" id="fname"></div>
        <div class="size" id="fsize"></div>
      </div>
      <button type="button" class="remove" id="remove">Remove</button>
    </div>
  </div>

  <button type="submit" id="submit" disabled>Submit</button>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <p class="note">Adds a row to the R&amp;D Rotation sheet.</p>
</form>

<script>
  /* ---------------- config ---------------- */
  // Apps Script web app deployment (Execute as: me / Who has access: anyone).
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzOZodGtYV2Opd5Nj5cckIcdCGPQZ7DXzV97mVSYKanBbnSg1dH9z8-4dpD3ubMiGe4PA/exec';
  // NOT a secret - this file is public, so anyone can read it. It only deters
  // drive-by posts; it is not access control.
  const KEY = 'rnd-rotation-2026';

  const IMG_MAX_DIM   = 1200;  // longest side of a plain image upload
  const PAGE_MAX_H    = 1200;  // tallest we render any single PDF page
  const STRIP_MAX_W   = 3600;  // total width budget for the composed strip
  const PDF_MAX_PAGES = 10;    // pages past this are not drawn
  const GUTTER        = 12;    // gap between pages in the strip
  const MAX_FILE_MB   = 25;
  const IMG_QUALITY   = 0.85;
  const PDF_QUALITY   = 0.92;  // rendered text needs more than a photo does

  // pdf.js 3.x is the last line shipping a UMD build on cdnjs; 4.x is ESM-only.
  const PDFJS_SRC    = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  /* ---------------------------------------- */

  const form     = document.getElementById('form');
  const nameEl   = document.getElementById('name');
  const drop      = document.getElementById('drop');
  const fileEl   = document.getElementById('file');
  const preview  = document.getElementById('preview');
  const thumb    = document.getElementById('thumb');
  const fname    = document.getElementById('fname');
  const fsize    = document.getElementById('fsize');
  const remove   = document.getElementById('remove');
  const submit   = document.getElementById('submit');
  const statusEl = document.getElementById('status');

  // Whatever will actually be written to the cell, computed at selection time
  // so the preview shows exactly what lands in the sheet.
  let prepared = null;   // { dataUrl, aspect, pages, drawn, w, h }
  let busy = false;

  const kb = b => b < 1024 * 1024
    ? (b / 1024).toFixed(0) + ' KB'
    : (b / 1024 / 1024).toFixed(1) + ' MB';

  // A base64 payload carries 3 bytes per 4 chars.
  const dataUrlBytes = u => Math.round((u.length - (u.indexOf(',') + 1)) * 3 / 4);

  function setStatus(kind, msg) {
    statusEl.className = 'status show ' + kind;
    statusEl.textContent = msg;
  }
  function clearStatus() {
    statusEl.className = 'status';
    statusEl.textContent = '';
  }

  // Both fields are mandatory, and nothing is submittable mid-render.
  function sync() {
    submit.disabled = !(nameEl.value.trim() && prepared && !busy);
  }

  const isPdf = f =>
    f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '');

  /* ---------------- pdf.js, loaded only when a PDF shows up ------------- */

  let pdfjsReady = null;
  function loadPdfJs() {
    if (pdfjsReady) return pdfjsReady;
    pdfjsReady = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = PDFJS_SRC;
      s.onload = () => {
        if (!window.pdfjsLib) return reject(new Error('pdf.js loaded but exposed nothing'));
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
        resolve(window.pdfjsLib);
      };
      s.onerror = () => reject(new Error('could not load the PDF library'));
      document.head.appendChild(s);
    });
    return pdfjsReady;
  }

  /* ---------------- preparing the cell image --------------------------- */

  async function prepareImage(file) {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, IMG_MAX_DIM / Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width * scale));
    const h = Math.max(1, Math.round(bmp.height * scale));
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';           // JPEG has no alpha - avoid black fringing
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    return { dataUrl: c.toDataURL('image/jpeg', IMG_QUALITY), aspect: w / h, pages: 1, drawn: 1, w, h };
  }

  /**
   * Render a PDF into ONE image: pages laid out left to right.
   *
   * A cell holds a single image, so multi-page means compositing rather than
   * multiple values. Pages are normalised to a common height (so portrait and
   * landscape pages line up), and that height is chosen so the whole strip
   * fits inside STRIP_MAX_W - more pages therefore means each page is smaller,
   * which keeps the upload bounded no matter how long the document is.
   */
  async function preparePdf(file) {
    const pdfjs = await loadPdfJs();
    const buf = await file.arrayBuffer();

    let doc;
    try {
      doc = await pdfjs.getDocument({ data: buf }).promise;
    } catch (err) {
      if (err && err.name === 'PasswordException') {
        throw new Error('that PDF is password-protected');
      }
      throw new Error('that file could not be read as a PDF');
    }

    const total = doc.numPages;
    if (!total) throw new Error('that PDF has no pages');
    const drawn = Math.min(total, PDF_MAX_PAGES);

    // Measure first, so the common height can be solved for in one go.
    const sheets = [];
    let aspectSum = 0;
    for (let i = 1; i <= drawn; i++) {
      const page = await doc.getPage(i);
      const vp = page.getViewport({ scale: 1 });
      const aspect = vp.width / vp.height;
      aspectSum += aspect;
      sheets.push({ page, aspect, baseH: vp.height });
    }

    const gutters = GUTTER * (drawn - 1);
    const h = Math.max(1, Math.min(PAGE_MAX_H, Math.floor((STRIP_MAX_W - gutters) / aspectSum)));
    const widths = sheets.map(s => Math.max(1, Math.round(h * s.aspect)));
    const stripW = widths.reduce((a, b) => a + b, 0) + gutters;

    const strip = document.createElement('canvas');
    strip.width = stripW;
    strip.height = h;
    const sctx = strip.getContext('2d');
    sctx.fillStyle = '#fff';
    sctx.fillRect(0, 0, stripW, h);

    let x = 0;
    for (let i = 0; i < drawn; i++) {
      const { page, baseH } = sheets[i];
      const w = widths[i];
      const vp = page.getViewport({ scale: h / baseH });

      const pc = document.createElement('canvas');
      pc.width = Math.max(1, Math.round(vp.width));
      pc.height = Math.max(1, Math.round(vp.height));
      const pctx = pc.getContext('2d');
      pctx.fillStyle = '#fff';                  // pages are usually transparent
      pctx.fillRect(0, 0, pc.width, pc.height);
      await page.render({ canvasContext: pctx, viewport: vp }).promise;

      sctx.drawImage(pc, x, 0, w, h);
      sctx.strokeStyle = '#c8ccd2';             // hairline so pages stay distinct
      sctx.lineWidth = 1;
      sctx.strokeRect(x + 0.5, 0.5, w - 1, h - 1);
      x += w + GUTTER;
    }

    return {
      dataUrl: strip.toDataURL('image/jpeg', PDF_QUALITY),
      aspect: stripW / h,
      pages: total,
      drawn,
      w: stripW,
      h
    };
  }

  /* ---------------- selection handling --------------------------------- */

  async function handleFile(file) {
    if (!file) return;

    const pdf = isPdf(file);
    if (!pdf && !file.type.startsWith('image/')) {
      setStatus('err', 'Please choose an image or a PDF.');
      return;
    }
    if (file.size > MAX_FILE_MB * 1024 * 1024) {
      setStatus('err', 'That file is over ' + MAX_FILE_MB + ' MB. Please use a smaller one.');
      return;
    }

    busy = true;
    prepared = null;
    sync();
    setStatus('busy', pdf ? 'Rendering PDF…' : 'Processing image…');

    try {
      prepared = pdf ? await preparePdf(file) : await prepareImage(file);

      thumb.src = prepared.dataUrl;
      fname.textContent = file.name;

      const bits = [];
      if (prepared.pages > 1) {
        bits.push(prepared.drawn < prepared.pages
          ? 'first ' + prepared.drawn + ' of ' + prepared.pages + ' pages'
          : prepared.pages + ' pages, side by side');
      }
      bits.push(kb(dataUrlBytes(prepared.dataUrl)));
      fsize.textContent = bits.join(' · ');

      preview.classList.add('show');
      drop.style.display = 'none';

      if (prepared.drawn < prepared.pages) {
        setStatus('busy', 'Only the first ' + PDF_MAX_PAGES +
          ' pages fit in one cell — the rest are not included.');
      } else {
        clearStatus();
      }
    } catch (err) {
      prepared = null;
      setStatus('err', 'Could not use that file: ' + err.message);
    } finally {
      busy = false;
      sync();
    }
  }

  function clearFile() {
    prepared = null;
    fileEl.value = '';
    thumb.removeAttribute('src');
    preview.classList.remove('show');
    drop.style.display = '';
    clearStatus();
    sync();
  }

  drop.addEventListener('click', () => fileEl.click());
  drop.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileEl.click(); }
  });

  ['dragenter', 'dragover'].forEach(t =>
    drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t =>
    drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));

  drop.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  fileEl.addEventListener('change', () => handleFile(fileEl.files[0]));
  nameEl.addEventListener('input', sync);
  remove.addEventListener('click', clearFile);

  /* ---------------- submit --------------------------------------------- */

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const name = nameEl.value.trim();
    if (!name || !prepared || busy) return;   // the disabled button covers this

    busy = true;
    sync();
    submit.textContent = 'Submitting…';
    setStatus('busy', 'Adding row to the sheet…');

    try {
      // text/plain keeps this a CORS "simple request". Apps Script web apps do
      // not answer preflight OPTIONS, so application/json would fail outright.
      const res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          key: KEY,
          name: name,
          image: prepared.dataUrl,
          aspect: prepared.aspect,
          pages: prepared.drawn
        })
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'unknown error');

      setStatus('ok', 'Added “' + name + '” to row ' + data.row + '.');
      nameEl.value = '';
      fileEl.value = '';
      prepared = null;
      thumb.removeAttribute('src');
      preview.classList.remove('show');
      drop.style.display = '';
    } catch (err) {
      setStatus('err', 'Could not submit: ' + err.message);
    } finally {
      busy = false;
      submit.textContent = 'Submit';
      sync();
    }
  });
</script>

</body>
</html>
